version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    environment:
      DEBUG: 'False'
      SECRET_KEY: 'production-secret-key-change-me-in-production'
      DB_NAME: ecommerce_db
      DB_USER: postgres
      DB_PASSWORD: password123
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: 'localhost,127.0.0.1,web'
      CORS_ALLOWED_ORIGINS: 'http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000'
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/dashboard/metrics/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data: