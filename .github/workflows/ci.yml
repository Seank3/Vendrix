name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Production settings import & guards
        env:
          DJANGO_SETTINGS_MODULE: vendrix.settings.production
          SECRET_KEY: ci-only-secret-key
          ALLOWED_HOSTS: example.com
          CREDENTIALS_ENCRYPTION_KEY: aBLFWLImsTM52Bdv24kXRFJ_-QMrbZK9TtPeiVYv7Uk=
          DATABASE_URL: sqlite:///ci.db
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py check
          python - <<'EOF'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'vendrix.settings.production')
          os.environ.pop('SECRET_KEY', None)
          try:
              import django
              django.setup()
          except Exception as exc:
              assert 'SECRET_KEY is required' in str(exc), f'unexpected: {exc}'
              print('fail-fast guard OK (missing SECRET_KEY rejected)')
          EOF

      - name: Verify migrations apply cleanly
        run: |
          python manage.py migrate --noinput
          python scripts/run_seed_admin.py

  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
